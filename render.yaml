# Render Blueprint for the CampusOS ERP backend (server/server.py).
# Persistent disks require a paid instance type on Render (starter or higher).
services:
  - type: web
    name: campusos-erp
    runtime: python
    plan: starter
    buildCommand: pip install -r server/requirements.txt   # only the official anthropic SDK (used lazily by PractiVerse generation)
    startCommand: python3 server/server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: CAMPUSOS_ENV
        value: production
      - key: CAMPUSOS_SECRET_KEY
        generateValue: true        # Render generates a strong value once; it stays stable across deploys
      - key: CAMPUSOS_DB_PATH
        value: /var/data/campusos.db
      - key: CAMPUSOS_DEMO_PASSWORD
        sync: false                # you enter this in the dashboard; never commit it
      - key: CAMPUSOS_ADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEY          # free-tier generator (preferred when set); enter it in the dashboard only
        sync: false
      - key: ANTHROPIC_API_KEY     # paid alternative; PractiVerse "Generate a practical for any topic". Enter it in the dashboard only.
        sync: false
      - key: CAMPUSOS_LLM_MODEL    # optional; defaults to claude-opus-5-5
        sync: false
      - key: CAMPUSOS_GEN_PER_HOUR # optional; per-user generation limit, default 12
        value: "12"
    disk:
      name: campusos-data
      mountPath: /var/data
      sizeGB: 1
